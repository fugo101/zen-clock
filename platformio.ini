; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display-s3]
; Pinned: an unpinned platform resolves to whatever is installed locally, so the
; dev machine and the self-hosted CI runner can silently build against different
; ESP-IDF versions. 7.0.1 ships ESP-IDF 6.0.1.
platform = espressif32@7.0.1
board = lilygo-t-display-s3
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts =
    post:scripts/fix_compiledb.py
board_build.partitions = partitions.csv
; clang-tidy matches the curated .clang-tidy at the repo root; the default cppcheck integration
; does not consume that config at all. Uses the compile_commands.json that fix_compiledb.py
; already fixes up for clangd, so no extra plumbing is needed.
;
; PlatformIO's clangtidy integration always injects its own --checks=* first, which fully
; overrides .clang-tidy regardless (clang-tidy uses the last -checks=/--checks= on the command
; line, and only falls back to .clang-tidy's Checks: when there is none at all). That "*" is
; also what CLion's own "Static Code Analysis" action runs under the hood, with no way to pass
; extra flags from the UI — so the override has to live here, in check_flags, not only in a
; wrapper script, or CLion's button reports ~600 findings from checks this project never
; enabled. check_src_filters mirrors the scope used everywhere else (project code only, no
; vendored/managed sources).
;
; KEEP THIS Checks= STRING IN SYNC WITH .clang-tidy's Checks: — scripts/pio_check.py fails loudly
; if they drift apart, but there is no way to derive one from the other in two static config
; files, so this is an *enforced* duplication, not an accidental one.
check_tool = clangtidy
check_src_filters = +<src/*> +<components/*>
check_flags = clangtidy: -checks=-*,bugprone-*,cert-dcl03-c,cert-dcl16-c,cert-dcl37-c,cert-env33-c,cert-err34-c,cert-flp30-c,cert-msc30-c,cert-msc32-c,cert-pos44-c,clang-analyzer-*,misc-redundant-expression,misc-unused-parameters,readability-braces-around-statements,readability-function-cognitive-complexity,readability-identifier-naming,readability-inconsistent-ptr-usage,-bugprone-easily-swappable-parameters,-bugprone-branch-clone,-bugprone-infinite-loop,-bugprone-signed-bitwise,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling

; Host-side unit tests for logic pure enough to not need the ESP-IDF toolchain at all — see
; test/test_pure_logic/. Deliberately not "test_build_src = yes": this must NOT try to compile
; src/ or the rest of components/, which are ESP-IDF-only.
[env:native]
platform = native
test_framework = unity
lib_deps = throwtheswitch/Unity@^2.6.1
