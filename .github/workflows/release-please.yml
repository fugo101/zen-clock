name: Release Please

on:
  push:
    branches: [ main ]

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: [ self-hosted, Linux, X64 ]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # App token required: GITHUB_TOKEN-created PRs do not trigger downstream
          # workflows, so CI would not run on Release PRs without it. Short-lived and
          # scoped to this repo, unlike the PAT it replaces (which expires silently).
          token: ${{ steps.app-token.outputs.token }}

  build-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [ self-hosted, Linux, X64 ]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup PlatformIO PATH
        run: echo "$HOME/.platformio/penv/bin" >> $GITHUB_PATH

      - name: Check Python
        run: |
          if ! python3 --version 2>/dev/null; then
            echo "ERROR: python3 not found. Install it on the runner first."
            exit 1
          fi

      - name: Check PlatformIO
        run: |
          if ! pio --version 2>/dev/null; then
            echo "ERROR: pio not found. Run 'pip3 install platformio' on the runner first."
            exit 1
          fi

      - name: Configure PlatformIO build cache
        # Same cache as ci.yml's build job — see the comment there for why the namespace is hashed
        # rather than a flat dir (SCons's build signature doesn't see flags carried via response
        # files, so an sdkconfig change alone wouldn't otherwise bust the cache).
        run: |
          KEY="${{ hashFiles('sdkconfig.lilygo-t-display-s3', 'platformio.ini', 'dependencies.lock') }}"
          DIR="$HOME/.cache/zen-clock/pio-build-cache/$KEY"
          mkdir -p "$DIR"
          echo "PLATFORMIO_BUILD_CACHE_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Build cache namespace: $KEY"

      - name: Build firmware
        run: pio run -e lilygo-t-display-s3

      - name: Rename artifacts with version
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          cp .pio/build/lilygo-t-display-s3/bootloader.bin "bootloader-${VERSION}.bin"
          cp .pio/build/lilygo-t-display-s3/partitions.bin "partitions-${VERSION}.bin"
          cp .pio/build/lilygo-t-display-s3/ota_data_initial.bin "ota_data_initial-${VERSION}.bin"
          cp .pio/build/lilygo-t-display-s3/firmware.bin "firmware-${VERSION}.bin"
          sha256sum "bootloader-${VERSION}.bin" "partitions-${VERSION}.bin" \
            "ota_data_initial-${VERSION}.bin" "firmware-${VERSION}.bin" > "checksums-${VERSION}.txt"

      - name: Create GitHub Release with firmware
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          append_body: true
          body: |
            Flash a blank board (offsets from `pio run -t upload -v`, esp32s3, 16MB flash):
            ```
            esptool.py --chip esp32s3 write_flash -z --flash_mode dio --flash_freq 80m --flash_size 16MB \
              0x0     bootloader-${{ needs.release-please.outputs.version }}.bin \
              0x8000  partitions-${{ needs.release-please.outputs.version }}.bin \
              0xe000  ota_data_initial-${{ needs.release-please.outputs.version }}.bin \
              0x10000 firmware-${{ needs.release-please.outputs.version }}.bin
            ```
            Verify downloads: `sha256sum -c checksums-${{ needs.release-please.outputs.version }}.txt`
          files: |
            bootloader-*.bin
            partitions-*.bin
            ota_data_initial-*.bin
            firmware-*.bin
            checksums-*.txt

      - name: Prune build cache
        if: always()
        run: |
          ROOT="$HOME/.cache/zen-clock/pio-build-cache"
          [ -d "$ROOT" ] || exit 0
          find "$ROOT" -type f -atime +14 -delete
          find "$ROOT" -mindepth 1 -type d -empty -delete
          echo "Build cache size: $(du -sh "$ROOT" | cut -f1)"
