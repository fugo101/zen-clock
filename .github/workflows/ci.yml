name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # This name is the required-status-check contract registered on the `main` ruleset.
    # Renaming this job means the required check never reports and every PR blocks forever —
    # update the ruleset in the same change if you ever rename it.
    name: Build, Test & Analyze
    runs-on: [ self-hosted, Linux, X64 ]
    timeout-minutes: 20
    # No `if: ... fork == false` guard here: the repo already requires manual approval to run
    # workflows from a first-time contributor's fork PR (Settings > Actions > fork PR approval
    # policy), which is what actually protects the self-hosted runner. Skipping the job on top
    # of that made GitHub count "skipped" as "passed" for this required check, letting an
    # approved-but-unbuilt fork PR merge anyway.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need history for the build-relevant-changes diff below; repo is 2.6M, cheap

      - name: Setup PlatformIO PATH
        run: echo "$HOME/.platformio/penv/bin" >> $GITHUB_PATH

      - name: Check Python
        run: |
          if ! python3 --version 2>/dev/null; then
            echo "ERROR: python3 not found. Install it on the runner first."
            exit 1
          fi

      - name: Check PlatformIO
        run: |
          if ! pio --version 2>/dev/null; then
            echo "ERROR: pio not found. Run 'pip3 install platformio' on the runner first."
            exit 1
          fi

      - name: Check for leaked credentials
        run: python3 scripts/check_secrets.py

      - name: Reject committed override_path
        # override_path in any idf_component.yml is a local-machine escape hatch (see
        # src/idf_component.yml's comment) -- it points at an absolute path on whoever's machine
        # committed it, and serializes into dependencies.lock as type: local, silently replacing
        # the registry package with an uncommitted local checkout for every consumer of that lock
        # file. `git ls-files` (not `find`) keeps managed_components/** out of scope. Anchored to
        # the YAML key so the commented-out example in src/idf_component.yml doesn't trip it.
        run: |
          if git ls-files '*idf_component.yml' | xargs -r grep -nE '^[[:space:]]*override_path[[:space:]]*:'; then
            echo "::error::Uncommented override_path found in a tracked idf_component.yml — this is a local-only escape hatch, never commit it."
            exit 1
          fi

      - name: Check formatting
        run: python3 scripts/format.py --check

      - name: Detect build-relevant changes
        id: changes
        # `actions/checkout`'s `git clean -ffdx` wipes .pio/ every run (it's gitignored, so a
        # persistent self-hosted workspace doesn't help), which forces a full rebuild even for a
        # docs-only PR. This gate skips the expensive steps in that case WITHOUT skipping the job —
        # `Build, Test & Analyze` is the required-status-check name, and a skipped job still reports
        # as skipped=success, so the check keeps landing. Do not switch this to workflow-level
        # `paths-ignore`: that skips the whole job, the required check never reports, and every PR
        # blocks forever (see the fork-PR guard note above for the same failure mode).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Base commit not resolvable (new branch / force-push) — building to be safe."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "$CHANGED"
          # Inverted allow-list, fail-safe: only skip when EVERY changed file is in the known-inert
          # set. Any file or directory not matched here — including anything new — forces a build.
          if echo "$CHANGED" | grep -qvE '^(docs/|\.claude/|\.run/|\.idea/|README\.md|CLAUDE\.md|CHANGELOG\.md|THIRD_PARTY\.md|LICENSE)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs-only change — skipping build/test/analyze."
          fi

      - name: Configure PlatformIO build cache
        if: steps.changes.outputs.code == 'true'
        # SCons (which PlatformIO/espidf use for every object, not ninja — ninja only runs for
        # `menuconfig`) hashes the build signature from the COMMAND LINE, but ESP-IDF 6.x passes
        # flags via response files (`@.../toolchain/cflags`) that espidf.py appends by PATH, not by
        # content (see process_response_file() in the espidf builder). So the signature is blind to
        # flag changes: an sdkconfig edit alone would not bust the cache. Namespacing the cache dir
        # by a hash of everything that can change those flags makes a config change fall through to
        # a fresh (one-time) cold build instead of silently serving stale objects. Verified locally:
        # cold build 89s / cache-retrieved rebuild 5.9s, bit-identical firmware.bin sha256.
        run: |
          KEY="${{ hashFiles('sdkconfig.lilygo-t-display-s3', 'platformio.ini', 'dependencies.lock') }}"
          DIR="$HOME/.cache/zen-clock/pio-build-cache/$KEY"
          mkdir -p "$DIR"
          echo "PLATFORMIO_BUILD_CACHE_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Build cache namespace: $KEY"

      - name: Run native unit tests
        if: steps.changes.outputs.code == 'true'
        run: pio test -e native

      - name: Build firmware
        if: steps.changes.outputs.code == 'true'
        run: pio run -e lilygo-t-display-s3

      - name: Check dependencies.lock is up to date
        # The build above regenerates dependencies.lock if it doesn't match the manifests it was
        # resolved from — so a diff here means a manifest changed without committing the result.
        if: steps.changes.outputs.code == 'true'
        run: |
          if ! git diff --exit-code dependencies.lock; then
            echo "::error::dependencies.lock is stale — a manifest changed without regenerating it."
            echo "Run 'rm -rf .pio/build && pio run -e lilygo-t-display-s3' locally and commit the result."
            exit 1
          fi

      - name: Static analysis (pio check)
        if: steps.changes.outputs.code == 'true'
        run: python3 scripts/pio_check.py

      - name: Upload build artifact
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/lilygo-t-display-s3/firmware.bin
            .pio/build/lilygo-t-display-s3/partitions.bin
          retention-days: 7

      - name: Prune build cache
        if: always()
        # SCons's CacheDir has no eviction/max_size (verified: no such option in this repo's pinned
        # scons-local-4.8.1), so each sdkconfig/platformio.ini/dependencies.lock combination adds a
        # namespace (~285 MB) that otherwise only grows. CacheRetrieveFunc calls os.utime() on every
        # hit, so atime is a reliable "still in use" signal — unaffected by relatime, since it's an
        # explicit syscall, not a passive read.
        run: |
          ROOT="$HOME/.cache/zen-clock/pio-build-cache"
          [ -d "$ROOT" ] || exit 0
          find "$ROOT" -type f -atime +14 -delete
          find "$ROOT" -mindepth 1 -type d -empty -delete
          echo "Build cache size: $(du -sh "$ROOT" | cut -f1)"
